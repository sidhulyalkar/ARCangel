      - 'src/arc3lab/evaluation/runner.py'
      - 'scripts/run_swarm_lab.py'
      - 'scripts/run_arena_contestant.py'
      - 'scripts/run_first_tournament.py'
      - 'scripts/run_augmented_blind.py'
      - 'scripts/run_v013_campaign.py'
      - 'scripts/run_research_swarm.py'
      - 'scripts/run_swarm_council.py'
      - 'scripts/run_swarm_research_cycle.py'
      - 'scripts/route_swarm_experiments.py'
      - 'scripts/run_swarm_measurement_gpu_stage.py'
      - 'scripts/run_autonomous_swarm_generation.py'
      - 'scripts/run_swarm_experiment.py'
      - 'scripts/run_guarded_swarm_experiment.py'
      - 'scripts/run_portable_swarm_gpu_stage.py'
      - 'scripts/run_promoted_swarm_contestant.py'
      - 'scripts/promote_swarm_experiment.py'
      - 'scripts/package_promoted_swarm.py'
      - 'scripts/llm_patch_worker.py'
      - 'scripts/retrying_llm_patch_worker.py'
      - 'scripts/check_research_providers.py'
      - 'scripts/export_swarm_worker_patches.py'
      - 'scripts/materialize_swarm_patch.py'
      - 'scripts/verify_swarm_research_workflow.py'
      - 'scripts/ingest_swarm_fitness.py'
      - 'scripts/record_swarm_outcome.py'
