name: swarm-ci

on:
  push:
    paths:
      - 'src/arc3lab/arena/**'
      - 'src/arc3lab/evaluation/runner.py'
      - 'scripts/run_swarm_lab.py'
      - 'scripts/run_arena_contestant.py'
      - 'scripts/run_first_tournament.py'
      - 'scripts/run_v013_campaign.py'
      - 'scripts/run_research_swarm.py'
      - 'scripts/run_swarm_council.py'
      - 'scripts/run_swarm_research_cycle.py'
      - 'scripts/record_swarm_outcome.py'
      - 'scripts/init_swarm_splits.py'
      - 'scripts/plan_research_round.py'
      - 'scripts/run_experiment_workers.py'
      - 'scripts/run_v013_candidate.py'
      - 'scripts/build_v013_candidate_notebook.py'
      - 'scripts/verify_v013_candidate_notebook.py'
      - 'scripts/package_kaggle_ready.py'
      - 'configs/swarm-v013.json'
      - 'configs/swarm-packet-files.txt'
      - 'configs/research-providers*.json'
      - 'configs/experiment-workers.example.json'
      - 'tests/test_v013_*.py'
      - '.github/workflows/swarm-ci.yml'
  pull_request:
    paths:
      - 'src/arc3lab/arena/**'
      - 'src/arc3lab/evaluation/runner.py'
      - 'scripts/run_swarm_lab.py'
      - 'scripts/run_arena_contestant.py'
      - 'scripts/run_first_tournament.py'
      - 'scripts/run_v013_campaign.py'
      - 'scripts/run_research_swarm.py'
      - 'scripts/run_swarm_council.py'
      - 'scripts/run_swarm_research_cycle.py'
      - 'scripts/record_swarm_outcome.py'
      - 'scripts/init_swarm_splits.py'
      - 'scripts/plan_research_round.py'
      - 'scripts/run_experiment_workers.py'
      - 'scripts/run_v013_candidate.py'
      - 'scripts/build_v013_candidate_notebook.py'
      - 'scripts/verify_v013_candidate_notebook.py'
      - 'scripts/package_kaggle_ready.py'
      - 'configs/swarm-v013.json'
      - 'configs/swarm-packet-files.txt'
      - 'configs/research-providers*.json'
      - 'configs/experiment-workers.example.json'
      - 'tests/test_v013_*.py'
      - '.github/workflows/swarm-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swarm-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/run_swarm_lab.py validate
      - run: python scripts/run_research_swarm.py --providers configs/research-providers.example.json --plan-only
      - run: python -m pytest -q tests/test_v013_*.py
      - run: >-
          python -m ruff check
          src/arc3lab/arena
          src/arc3lab/evaluation/runner.py
          scripts/run_swarm_lab.py
          scripts/run_arena_contestant.py
          scripts/run_first_tournament.py
          scripts/run_v013_campaign.py
          scripts/run_research_swarm.py
          scripts/run_swarm_council.py
          scripts/run_swarm_research_cycle.py
          scripts/record_swarm_outcome.py
          scripts/init_swarm_splits.py
          scripts/plan_research_round.py
          scripts/run_experiment_workers.py
          scripts/run_v013_candidate.py
          scripts/build_v013_candidate_notebook.py
          scripts/verify_v013_candidate_notebook.py
          scripts/package_kaggle_ready.py
          tests/test_v013_*.py
      - run: >-
          python -m compileall -q
          src/arc3lab/arena
          src/arc3lab/evaluation/runner.py
          scripts/run_swarm_lab.py
          scripts/run_arena_contestant.py
          scripts/run_first_tournament.py
          scripts/run_v013_campaign.py
          scripts/run_research_swarm.py
          scripts/run_swarm_council.py
          scripts/run_swarm_research_cycle.py
          scripts/record_swarm_outcome.py
          scripts/init_swarm_splits.py
          scripts/plan_research_round.py
          scripts/run_experiment_workers.py
          scripts/run_v013_candidate.py
          scripts/build_v013_candidate_notebook.py
          scripts/verify_v013_candidate_notebook.py
          scripts/package_kaggle_ready.py
      - run: >-
          python scripts/build_v013_candidate_notebook.py
          --profile v012-lite
          --contestant-id E-v012-lite
          --build-id CI-V013-E
          --output /tmp/arcangel-v013-e.ipynb
      - run: >-
          python scripts/verify_v013_candidate_notebook.py
          /tmp/arcangel-v013-e.ipynb
          --profile v012-lite
          --contestant-id E-v012-lite
          --build-id CI-V013-E
