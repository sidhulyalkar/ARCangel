name: swarm-research

on:
  workflow_dispatch:
    inputs:
      generation:
        description: 'Swarm generation number'
        required: true
        default: '1'
        type: string
      max_proposals:
        description: 'Maximum council-selected coding experiments'
        required: true
        default: '4'
        type: string

concurrency:
  group: swarm-research-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nvidia-research-swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ARCangel
        run: python -m pip install -e '.[dev]'

      - name: Require NVIDIA research credential
        shell: bash
        run: |
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo 'NVIDIA_API_KEY GitHub Actions secret is required.' >&2
            exit 2
          fi

      - name: Record immutable research base
        id: base
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git status --short

      - name: Probe heterogeneous NVIDIA endpoints
        id: providers
        run: >-
          python scripts/check_research_providers.py
          --providers configs/research-providers.nvidia-swarm.json
          --output artifacts/arena/v013/provider-health.json

      - name: Run independent swarm and blinded council
        id: council
        run: >-
          python scripts/run_swarm_research_cycle.py
          --providers configs/research-providers.nvidia-swarm.json
          --manifest configs/swarm-v013.json
          --arena-root artifacts/arena/v013
          --repo-root .
          --generation '${{ inputs.generation }}'
          --max-proposals '${{ inputs.max_proposals }}'
          --max-research-requests 20
          --max-review-requests 60
          --reviews-per-proposal 3
          --min-reviews 2
          --max-workers 6

      - name: Implement council-selected cognition patches
        id: workers
        continue-on-error: true
        run: >-
          python scripts/run_experiment_workers.py
          --workers configs/experiment-workers.nvidia.json
          --battle-plan 'artifacts/arena/v013/swarm-battle-generation-${{ inputs.generation }}.json'
          --repo-root .
          --worktree-root ../arcangel-experiment-worktrees
          --receipt-root artifacts/arena/v013/worker-receipts
          --base-ref '${{ steps.base.outputs.sha }}'

      - name: Export cognition-only worker patches
        id: patches
        continue-on-error: true
        run: >-
          python scripts/export_swarm_worker_patches.py
          --battle-plan 'artifacts/arena/v013/swarm-battle-generation-${{ inputs.generation }}.json'
          --base-sha '${{ steps.base.outputs.sha }}'
          --repo-root .
          --worktree-root ../arcangel-experiment-worktrees
          --receipt-root artifacts/arena/v013/worker-receipts
          --output-dir 'artifacts/arena/v013/portable-patches/generation-${{ inputs.generation }}'

      - name: Export blind-safe research context receipt
        if: always()
        continue-on-error: true
        run: >-
          python scripts/export_swarm_context.py
          --manifest configs/swarm-v013.json
          --arena-root artifacts/arena/v013
          --repo-root .
          --output 'artifacts/arena/v013/swarm-context-generation-${{ inputs.generation }}.tar.gz'
          --receipt 'artifacts/arena/v013/swarm-context-generation-${{ inputs.generation }}.json'

      - name: Upload research handoff and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcangel-swarm-generation-${{ inputs.generation }}-${{ steps.base.outputs.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifacts/arena/v013/provider-health.json
            artifacts/arena/v013/proposals/generation-${{ inputs.generation }}/
            artifacts/arena/v013/reviews/generation-${{ inputs.generation }}/
            artifacts/arena/v013/swarm-battle-generation-${{ inputs.generation }}.json
            artifacts/arena/v013/swarm-cycle-generation-${{ inputs.generation }}.json
            artifacts/arena/v013/worker-receipts/
            artifacts/arena/v013/portable-patches/generation-${{ inputs.generation }}/
            artifacts/arena/v013/swarm-context-generation-${{ inputs.generation }}.tar.gz
            artifacts/arena/v013/swarm-context-generation-${{ inputs.generation }}.json

      - name: Qualify portable handoff
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          generation = os.environ.get('GENERATION', '${{ inputs.generation }}')
          health = Path('artifacts/arena/v013/provider-health.json')
          battle = Path(f'artifacts/arena/v013/swarm-battle-generation-{generation}.json')
          portable = Path(f'artifacts/arena/v013/portable-patches/generation-{generation}/manifest.json')
          problems = []
          if not health.exists() or json.loads(health.read_text()).get('status') != 'HEALTHY':
              problems.append('heterogeneous provider health gate did not pass')
          if not battle.exists() or int(json.loads(battle.read_text()).get('selected_count', 0)) < 1:
              problems.append('council produced no selected experiment')
          if not portable.exists() or int(json.loads(portable.read_text()).get('exported_count', 0)) < 1:
              problems.append('no software-qualified portable cognition patch survived')
          if problems:
              raise SystemExit('\n'.join(problems))
          print('REMOTE SWARM HANDOFF QUALIFIED')
          PY
